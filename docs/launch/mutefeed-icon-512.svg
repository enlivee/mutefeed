<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14171C"/>
      <stop offset="100%" stop-color="#090B0D"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F09A55"/>
      <stop offset="100%" stop-color="#E5853C"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#E5853C" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="#2B313D" stroke-width="4"/>

  <!-- Subtle noise-reduction ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#2B313D" stroke-width="3" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Speaker Body (Sound/Feed) -->
  <g filter="url(#glow)">
    <!-- Speaker Body Polygon -->
    <path d="M 160 200 L 220 200 L 300 136 L 300 376 L 220 312 L 160 312 Z" 
          fill="url(#accentGrad)" 
          stroke="#E5853C" 
          stroke-width="8" 
          stroke-linejoin="round"/>

    <!-- Noise-Cancelling Mute Cross (Active Noise Cancellation) -->
    <line x1="344" y1="216" x2="408" y2="296" 
          stroke="#F0F3F7" 
          stroke-width="18" 
          stroke-linecap="round"/>
    <line x1="408" y1="216" x2="344" y2="296" 
          stroke="#F0F3F7" 
          stroke-width="18" 
          stroke-linecap="round"/>
  </g>

  <!-- Clean Soundwaves (Faint / Subdued) -->
  <path d="M 120 226 C 110 244 110 268 120 286" fill="none" stroke="#9EABB9" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <path d="M 100 210 C 84 238 84 274 100 302" fill="none" stroke="#9EABB9" stroke-width="6" stroke-linecap="round" opacity="0.25"/>
</svg>
