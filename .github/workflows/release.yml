name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Build Release Binaries & Tarballs
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "Building MuteFeed release artifacts for $TAG..."
          mkdir -p dist
          cp README.md LICENSE dist/

          # 1. macOS ARM64 (Apple Silicon)
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w -X main.version=$TAG" -o dist/mutefeed .
          tar -czf "dist/mutefeed_darwin_arm64.tar.gz" -C dist mutefeed README.md LICENSE
          rm -f dist/mutefeed

          # 2. macOS AMD64 (Intel)
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w -X main.version=$TAG" -o dist/mutefeed .
          tar -czf "dist/mutefeed_darwin_amd64.tar.gz" -C dist mutefeed README.md LICENSE
          rm -f dist/mutefeed

          # 3. Linux AMD64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w -X main.version=$TAG" -o dist/mutefeed .
          tar -czf "dist/mutefeed_linux_amd64.tar.gz" -C dist mutefeed README.md LICENSE
          rm -f dist/mutefeed

          # 4. Linux ARM64 (Raspberry Pi / Graviton)
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w -X main.version=$TAG" -o dist/mutefeed .
          tar -czf "dist/mutefeed_linux_arm64.tar.gz" -C dist mutefeed README.md LICENSE
          rm -f dist/mutefeed

          # 5. Windows AMD64
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w -X main.version=$TAG" -o dist/mutefeed.exe .
          cd dist
          zip "mutefeed_windows_amd64.zip" mutefeed.exe README.md LICENSE
          rm -f mutefeed.exe README.md LICENSE
          sha256sum mutefeed_* > checksums.txt
          cd ..

          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
